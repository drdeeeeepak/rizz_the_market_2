name: EOD Compute

on:
  schedule:
    # 3:35 PM IST = 10:05 UTC  — first attempt (right after market close)
    - cron: "5 10 * * 1-5"
    # 4:05 PM IST = 10:35 UTC  — retry if user hadn't logged in yet
    - cron: "35 10 * * 1-5"
    # 5:05 PM IST = 11:35 UTC  — final retry
    - cron: "35 11 * * 1-5"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering manually?"
        required: false
        default: "manual run"

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Kite token validity
        id: token_check
        env:
          KITE_API_KEY:   ${{ secrets.KITE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
        run: |
          python - <<'EOF'
          # Actually CALL Kite with the token — do not just look at the date on the
          # file. A token invalidated during the session still carries today's date,
          # so the old date-only check passed, the job ran, and then every Kite call
          # failed. The day was lost with nothing but a red tick to show for it, and
          # option open interest cannot be back-filled from anywhere.
          import json, os, sys
          from pathlib import Path
          from datetime import datetime
          import pytz

          IST   = pytz.timezone("Asia/Kolkata")
          today = datetime.now(IST).strftime("%Y-%m-%d")
          now   = datetime.now(IST).strftime("%H:%M")

          def alert(reason: str, detail: str = ""):
              """Email and/or Telegram — this is the only chance to save the day."""
              print(f"{reason}: {detail}")
              try:
                  sys.path.insert(0, ".")
                  from data.notify import send_alert
                  send_alert(
                      f"EOD data collection BLOCKED — {reason}",
                      (f"premiumdecay could not collect today's data.\n\n"
                       f"Time:   {now} IST\n"
                       f"Reason: {reason}\n"
                       f"Detail: {detail}\n\n"
                       "WHAT TO DO: open premiumdecay and log in to Kite now.\n"
                       "Retries run at 4:05 PM and 5:05 PM IST. After the last one, "
                       "today's option open interest is lost permanently — Kite "
                       "serves no historical option OI, so it cannot be back-filled "
                       "from anywhere."),
                      telegram_text=(f"⚠️ EOD data collection BLOCKED · {now} IST\n"
                                     f"Reason: {reason}\n{detail}\n\n"
                                     "Log in to premiumdecay now. Retries at 4:05 and "
                                     "5:05 PM IST — after that today's OI is lost "
                                     "permanently."))
              except Exception as e:
                  print(f"alert failed: {e}")

          api_key = os.environ.get("KITE_API_KEY", "").strip()
          if not api_key:
              alert("NO_API_KEY", "KITE_API_KEY secret is not set on the repository.")
              sys.exit(1)

          tf = Path("access_token.txt")
          if not tf.exists():
              alert("NO_TOKEN", "access_token.txt is missing — you have not logged in today.")
              sys.exit(1)
          try:
              d = json.loads(tf.read_text())
          except Exception as e:
              alert("BAD_TOKEN", f"access_token.txt is unreadable: {e}")
              sys.exit(1)
          if d.get("date") != today:
              alert("STALE_TOKEN", f"Token is from {d.get('date')}, today is {today}.")
              sys.exit(1)

          # The real test.
          try:
              from kiteconnect import KiteConnect
              k = KiteConnect(api_key=api_key)
              k.set_access_token(d.get("token"))
              who = k.profile().get("user_id", "?")
          except Exception as e:
              alert("TOKEN_REJECTED",
                    f"Token carries today's date but Kite rejected it ({type(e).__name__}). "
                    "You were most likely logged out during the session.")
              sys.exit(1)

          print(f"TOKEN_OK: live token for {today} (user {who})")
          EOF

      - name: Run EOD compute (options/signals)
        env:
          KITE_API_KEY:    ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
          ALERT_EMAIL:     ${{ secrets.ALERT_EMAIL }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASS:       ${{ secrets.SMTP_PASS }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
        run: python scripts/eod_compute.py

      - name: Build token map if missing
        continue-on-error: true
        env:
          KITE_API_KEY:    ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: |
          [ -f data/nifty500_tokens.json ] && echo "Token map exists, skipping fetch" || \
            python scripts/fetch_nifty500_tokens.py

      - name: Run EOD geo scan + OI snapshot + market health breadth
        continue-on-error: true
        env:
          KITE_API_KEY:    ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
        run: python scripts/run_scan.py --label eod --snapshot --health

      - name: Commit all outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/breach_levels.json data/rolled_positions.json \
                  data/gamma_history.json data/oi_history.json \
                  data/watchlists/ data/parquet/ data/nifty500_tokens.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: EOD compute + geo scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
